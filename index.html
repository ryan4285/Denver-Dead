<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111315">
<link rel="manifest" href="./manifest.webmanifest">
<title>Denver Dead — Twin Stick Fixed</title>
<style>
html,body{margin:0;background:#0f1113;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
*{box-sizing:border-box}
#game{max-width:760px;margin:auto;padding:10px}
.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:12px;text-align:center}
.hud>div{background:#1a1d20;border:1px solid #30353a;border-radius:9px;padding:6px}
.muted{color:#9ba3aa;font-size:10px}
#healthbar{height:14px;background:#3a1d1d;border:1px solid #454b51;border-radius:999px;overflow:hidden}
#healthfill{height:100%;background:#44c767;width:100%}
#gameCanvas{width:100%;display:block;background:#000;border:1px solid #333;border-radius:12px;touch-action:none}
.controls{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-top:18px;padding:8px 4px 2px}
.stickWrap,.aimWrap{display:flex;flex-direction:column;align-items:center;min-width:0}
#stick,#aimStick{position:relative;width:122px;height:122px;border-radius:50%;border:2px solid #555;background:#17191c;touch-action:none}
#knob,#aimKnob{position:absolute;width:50px;height:50px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#ddd}
.rightControls{display:flex;flex-direction:column;align-items:center;gap:7px}
.actionCluster{display:flex;align-items:center;gap:7px}
.round{border:0;border-radius:50%;font-weight:800;color:#fff;touch-action:none}
#bomb{width:64px;height:64px;background:#79571b;font-size:11px;opacity:.45}
#bomb.ready{background:#d68b18;opacity:1}
#switchGun{width:64px;height:64px;background:#2d5068;font-size:10px;opacity:.45}
#switchGun.ready{opacity:1}
#restart{display:block;margin:10px auto 0;padding:9px 14px;border-radius:8px;border:1px solid #444;background:#202428;color:#eee}
#notice{text-align:center;min-height:20px;font-weight:800;font-size:13px;color:#f2d07a}
@media(max-width:480px){#game{padding:7px}.hud{font-size:11px}.controls{gap:6px;padding:6px 0 0}#stick,#aimStick{width:108px;height:108px}#bomb,#switchGun{width:58px;height:58px}.actionCluster{gap:5px}}
</style>
</head>
<body>
<div id="game">
  <div class="hud">
    <div><span class="muted">WAVE</span><br><b id="wave">1</b></div>
    <div><span class="muted">KILLS</span><br><b id="kills">0</b></div>
    <div><span class="muted">SUPPORT</span><br><b id="support">0</b></div>
    <div><span class="muted">WEAPON</span><br><b id="weapon">Pistol</b></div>
    <div><span class="muted">BOMB</span><br><b id="bombHud">EMPTY</b></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:12px;margin:7px 0 3px"><b>HEALTH</b><span id="healthText">100 / 100</span></div>
  <div id="healthbar"><div id="healthfill"></div></div>
  <div id="progress" class="muted" style="margin:6px 0">20 pistol kills → Shotgun</div>
  <div id="notice"></div>
  <canvas id="gameCanvas" width="720" height="500"></canvas>
  <div class="controls">
    <div class="stickWrap">
      <div class="muted" style="margin-bottom:4px;text-align:center">MOVE</div>
      <div id="stick"><div id="knob"></div></div>
    </div>
    <div class="rightControls">
      <div class="actionCluster">
        <button id="switchGun" class="round" type="button">SWITCH<br>GUN</button>
        <button id="bomb" class="round" type="button">BOMB</button>
      </div>
      <div class="aimWrap">
        <div class="muted" style="margin-bottom:4px;text-align:center">AIM</div>
        <div id="aimStick"><div id="aimKnob"></div></div>
      </div>
    </div>
  </div>
  <button id="restart" type="button">Restart</button>
</div>
<script>
(()=>{
const c=document.getElementById('gameCanvas'),ctx=c.getContext('2d'),W=720,H=500,mapW=1800,mapH=1400;
const roads=[{x:0,y:210,w:1800,h:180},{x:0,y:620,w:1800,h:180},{x:0,y:1030,w:1800,h:180},{x:220,y:0,w:180,h:1400},{x:730,y:0,w:180,h:1400},{x:1260,y:0,w:180,h:1400}];
const blocks=[],cols=[40,450,960,1490],rows=[35,430,850];
for(let a=0;a<4;a++)for(let b=0;b<3;b++)blocks.push({x:cols[a],y:rows[b],w:[150,240,250,250][a],h:[140,155,145][b],label:['LoDo','Market','CBD','Civic'][a]});
const cars=[{x:560,y:285,w:72,h:34},{x:1060,y:695,w:78,h:36},{x:330,y:1110,w:74,h:34},{x:820,y:310,w:70,h:32},{x:1350,y:745,w:82,h:36},{x:780,y:1120,w:70,h:33},{x:1150,y:1110,w:76,h:34},{x:300,y:720,w:68,h:32}];
const supportSpots=[{x:520,y:520},{x:1510,y:920}];
const weapons={pistol:{name:'Pistol',damage:1,cd:260,pellets:1,spread:0},shotgun:{name:'Shotgun',damage:2,cd:520,pellets:6,spread:.30},rifle:{name:'Assault Rifle',damage:3,cd:105,pellets:1,spread:.04}};
let s,z=[],bul=[],drops=[],bombDrops=[],blood=[],tr=[],rings=[],joyX=0,joyY=0,aimX=1,aimY=0,pid=null,aimPid=null,last=performance.now(),lastShot=0,raf,noticeUntil=0;
const $=id=>document.getElementById(id);

function blocked(px,py,r){
  return blocks.some(b=>px+r>b.x&&px-r<b.x+b.w&&py+r>b.y&&py-r<b.y+b.h)||
         cars.some(q=>Math.hypot(px-q.x,py-q.y)<r+30);
}
function spot(minDist=0){
  let p,n=0;
  do{p={x:35+Math.random()*(mapW-70),y:35+Math.random()*(mapH-70)};n++}
  while((blocked(p.x,p.y,18)||Math.hypot(p.x-s.x,p.y-s.y)<minDist)&&n<800);
  return p;
}
function spawnWave(){
  const n=5+(s.wave-1)*5;
  for(let i=0;i<n;i++){
    let p=spot(280);
    z.push({x:p.x,y:p.y,hp:3+Math.floor((s.wave-1)/6),max:3+Math.floor((s.wave-1)/6),speed:48+Math.random()*20+s.wave*1.3,attack:0,dead:false});
  }
}
function say(t,secs=2.4){$('notice').textContent=t;noticeUntil=s.time+secs}
function reset(){
  s={x:850,y:730,a:-1.57,hp:100,wave:1,kills:0,support:0,gun:'pistol',pk:0,sk:0,time:0,nextHealth:30,nextBomb:50,bomb:false,over:false,
     s1mode:'none',s2mode:'none',nextS1:null,nextS2:null};
  z=[];bul=[];drops=[];bombDrops=[];blood=[];tr=[];rings=[];joyX=joyY=0;aimX=1;aimY=0;spawnWave();hud();say('SURVIVE DENVER',1.6);
}
function supportMode(slot){
  if(slot===1){
    if(s.wave>=10)return 'mg';
    if(s.wave>=5)return 'sniper';
  } else {
    if(s.wave>=20)return 'mg';
    if(s.wave>=15)return 'sniper';
  }
  return 'none';
}
function syncSupport(){
  const m1=supportMode(1),m2=supportMode(2);
  if(m1!==s.s1mode){
    s.s1mode=m1;
    s.nextS1=m1==='sniper'?s.time+10:m1==='mg'?s.time+3:null;
    if(m1==='sniper')say('ROOFTOP SNIPER HAS ARRIVED');
    if(m1==='mg')say('SNIPER 1 UPGRADED: MACHINE GUNNER');
  }
  if(m2!==s.s2mode){
    s.s2mode=m2;
    s.nextS2=m2==='sniper'?s.time+10:m2==='mg'?s.time+3:null;
    if(m2==='sniper')say('SECOND ROOFTOP SNIPER HAS ARRIVED');
    if(m2==='mg')say('SNIPER 2 UPGRADED: MACHINE GUNNER');
  }
}
function hud(){
  $('wave').textContent=s.wave;$('kills').textContent=s.kills;$('support').textContent=s.support;$('weapon').textContent=weapons[s.gun].name;
  $('healthText').textContent=Math.max(0,s.hp)+' / 100';$('healthfill').style.width=Math.max(0,s.hp)+'%';
  $('bombHud').textContent=s.bomb?'READY':'EMPTY';$('bomb').classList.toggle('ready',s.bomb);
  const unlocked=s.pk>=20||s.sk>=20||s.gun!=='pistol';
  $('switchGun').classList.toggle('ready',unlocked);
  $('switchGun').disabled=!unlocked;
  $('progress').textContent=s.gun==='pistol'?(20-s.pk)+' pistol kills → Shotgun':s.gun==='shotgun'?(20-s.sk)+' shotgun kills → Assault Rifle':'MAX WEAPON — Assault Rifle';
}
function playerKill(g){
  s.kills++;
  if(g==='pistol')s.pk++;
  if(g==='shotgun')s.sk++;
  if(s.gun==='pistol'&&s.pk>=20){s.gun='shotgun';say('SHOTGUN UNLOCKED!')}
  else if(s.gun==='shotgun'&&s.sk>=20){s.gun='rifle';say('ASSAULT RIFLE UNLOCKED!')}
}
function shoot(){
  if(s.over)return;
  let now=performance.now(),w=weapons[s.gun];
  if(now-lastShot<w.cd)return;
  lastShot=now;
  for(let i=0;i<w.pellets;i++){
    let a=s.a+(w.pellets===1?0:(Math.random()-.5)*w.spread);
    bul.push({x:s.x,y:s.y,vx:Math.cos(a)*700,vy:Math.sin(a)*700,life:1.1,damage:w.damage,gun:s.gun});
  }
}
function sniperShot(slot){
  const live=z.filter(q=>!q.dead); if(!live.length)return;
  const q=live[Math.floor(Math.random()*live.length)],p=supportSpots[slot-1];
  q.dead=true;s.support++;tr.push({x1:p.x,y1:p.y,x2:q.x,y2:q.y,life:.18});
}
function mgBurst(slot){
  const p=supportSpots[slot-1];
  for(let shot=0;shot<5;shot++){
    const live=z.filter(q=>!q.dead); if(!live.length)break;
    const q=live[Math.floor(Math.random()*live.length)];
    q.hp-=1;
    tr.push({x1:p.x,y1:p.y,x2:q.x+(Math.random()-.5)*12,y2:q.y+(Math.random()-.5)*12,life:.12+shot*.025});
    if(q.hp<=0){q.dead=true;s.support++}
  }
}

function switchGun(){
  const unlocked=['pistol'];
  if(s.pk>=20 || s.gun==='shotgun' || s.gun==='rifle' || s.sk>=20) unlocked.push('shotgun');
  if(s.sk>=20 || s.gun==='rifle') unlocked.push('rifle');
  if(unlocked.length<=1)return;
  let i=unlocked.indexOf(s.gun);
  s.gun=unlocked[(i+1)%unlocked.length];
  say(weapons[s.gun].name.toUpperCase(),1.0);
  hud();
}
function useBomb(){
  if(s.over||!s.bomb)return;
  s.bomb=false;
  const radius=190;
  rings.push({x:s.x,y:s.y,r:15,max:radius,life:.55});
  let n=0;
  for(const q of z){
    if(!q.dead&&Math.hypot(q.x-s.x,q.y-s.y)<=radius){
      q.dead=true;n++;s.kills++;blood.push({x:q.x,y:q.y,life:.65,big:true});
    }
  }
  say(n?`BOMB! ${n} ZOMBIE${n===1?'':'S'} WIPED OUT`:'BOMB! NO ZOMBIES IN RANGE');
}
function update(dt){
  if(!s.over){
    s.time+=dt;
    syncSupport();
    if(s.time>=s.nextHealth){drops.push({...spot(100),pulse:0});s.nextHealth+=30}
    if(s.wave>=10&&s.time>=s.nextBomb){if(!s.bomb&&bombDrops.length===0)bombDrops.push({...spot(130),pulse:0});s.nextBomb+=50}
    if(s.s1mode==='sniper'&&s.nextS1&&s.time>=s.nextS1){sniperShot(1);s.nextS1=s.time+10}
    if(s.s1mode==='mg'&&s.nextS1&&s.time>=s.nextS1){mgBurst(1);s.nextS1=s.time+3}
    if(s.s2mode==='sniper'&&s.nextS2&&s.time>=s.nextS2){sniperShot(2);s.nextS2=s.time+10}
    if(s.s2mode==='mg'&&s.nextS2&&s.time>=s.nextS2){mgBurst(2);s.nextS2=s.time+3}

    let m=Math.hypot(joyX,joyY);
    if(m>.08){
      let dx=joyX/m,dy=joyY/m,sp=155*Math.min(1,m);
      let nx=s.x+dx*sp*dt,ny=s.y+dy*sp*dt;
      if(!blocked(nx,s.y,14))s.x=Math.max(20,Math.min(mapW-20,nx));
      if(!blocked(s.x,ny,14))s.y=Math.max(20,Math.min(mapH-20,ny));
    }
    const am=Math.hypot(aimX,aimY);
    if(am>.08)s.a=Math.atan2(aimY,aimX);
    shoot();

    for(const q of z){
      if(q.dead)continue;
      let dx=s.x-q.x,dy=s.y-q.y,d=Math.hypot(dx,dy);
      if(d>27){
        let sp=q.speed*dt,nx=q.x+dx/d*sp,ny=q.y+dy/d*sp;
        if(!blocked(nx,q.y,16))q.x=nx; else if(!blocked(q.x,q.y+Math.sign(dy||1)*sp,16))q.y+=Math.sign(dy||1)*sp;
        if(!blocked(q.x,ny,16))q.y=ny; else if(!blocked(q.x+Math.sign(dx||1)*sp,q.y,16))q.x+=Math.sign(dx||1)*sp;
      } else {
        q.attack-=dt;
        if(q.attack<=0){s.hp-=5;q.attack=.72;if(s.hp<=0){s.hp=0;s.over=true}}
      }
    }

    for(let i=drops.length-1;i>=0;i--)if(Math.hypot(s.x-drops[i].x,s.y-drops[i].y)<28){s.hp=Math.min(100,s.hp+25);drops.splice(i,1);say('+25 HEALTH',1.4)}
    for(let i=bombDrops.length-1;i>=0;i--)if(Math.hypot(s.x-bombDrops[i].x,s.y-bombDrops[i].y)<30){s.bomb=true;bombDrops.splice(i,1);say('BOMB PICKED UP',1.5)}

    for(const b of bul){
      b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
      if(blocked(b.x,b.y,2)){b.life=0;continue}
      for(const q of z)if(!q.dead&&Math.hypot(b.x-q.x,b.y-q.y)<20){
        q.hp-=b.damage;b.life=0;blood.push({x:q.x,y:q.y,life:.4});
        if(q.hp<=0){q.dead=true;playerKill(b.gun)}
        break;
      }
    }
    bul=bul.filter(b=>b.life>0);
    blood.forEach(b=>b.life-=dt);blood=blood.filter(b=>b.life>0);
    tr.forEach(t=>t.life-=dt);tr=tr.filter(t=>t.life>0);
    rings.forEach(r=>{r.life-=dt;r.r+=(r.max-r.r)*Math.min(1,dt*10)});rings=rings.filter(r=>r.life>0);
    if(z.length&&z.every(q=>q.dead)){s.wave++;spawnWave();syncSupport()}
  }
  if(s.time>noticeUntil)$('notice').textContent='';
  hud();
}
function draw(){
  let cx=Math.max(W/2,Math.min(mapW-W/2,s.x)),cy=Math.max(H/2,Math.min(mapH-H/2,s.y)),sx=v=>v-cx+W/2,sy=v=>v-cy+H/2;
  ctx.fillStyle='#4a4f4c';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#272a2f';roads.forEach(r=>ctx.fillRect(sx(r.x),sy(r.y),r.w,r.h));
  ctx.lineWidth=3;ctx.strokeStyle='#dedede';ctx.setLineDash([20,18]);
  roads.forEach(r=>{ctx.beginPath();if(r.w>r.h){ctx.moveTo(sx(r.x),sy(r.y+r.h*.3));ctx.lineTo(sx(r.x+r.w),sy(r.y+r.h*.3));ctx.moveTo(sx(r.x),sy(r.y+r.h*.7));ctx.lineTo(sx(r.x+r.w),sy(r.y+r.h*.7))}else{ctx.moveTo(sx(r.x+r.w*.3),sy(r.y));ctx.lineTo(sx(r.x+r.w*.3),sy(r.y+r.h));ctx.moveTo(sx(r.x+r.w*.7),sy(r.y));ctx.lineTo(sx(r.x+r.w*.7),sy(r.y+r.h))}ctx.stroke()});
  ctx.setLineDash([]);ctx.strokeStyle='#d9b933';roads.forEach(r=>{ctx.beginPath();if(r.w>r.h){ctx.moveTo(sx(r.x),sy(r.y+r.h/2));ctx.lineTo(sx(r.x+r.w),sy(r.y+r.h/2))}else{ctx.moveTo(sx(r.x+r.w/2),sy(r.y));ctx.lineTo(sx(r.x+r.w/2),sy(r.y+r.h))}ctx.stroke()});
  for(const b of blocks){ctx.fillStyle='#2b2e32';ctx.fillRect(sx(b.x)+6,sy(b.y)+7,b.w,b.h);ctx.fillStyle='#555b61';ctx.fillRect(sx(b.x),sy(b.y),b.w,b.h);ctx.fillStyle='#ddd';ctx.font='11px sans-serif';ctx.fillText(b.label,sx(b.x)+8,sy(b.y)+15)}
  for(const q of cars){ctx.fillStyle='#646a70';ctx.fillRect(sx(q.x)-q.w/2,sy(q.y)-q.h/2,q.w,q.h);ctx.fillStyle='#252a2e';ctx.fillRect(sx(q.x)-15,sy(q.y)-q.h/2+5,30,q.h-10)}
  for(const d of drops){ctx.fillStyle='#eee';ctx.fillRect(sx(d.x)-12,sy(d.y)-12,24,24);ctx.fillStyle='#c92d2d';ctx.fillRect(sx(d.x)-4,sy(d.y)-10,8,20);ctx.fillRect(sx(d.x)-10,sy(d.y)-4,20,8)}
  for(const b of bombDrops){let px=sx(b.x),py=sy(b.y);ctx.fillStyle='#1c1c1c';ctx.beginPath();ctx.arc(px,py,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f2a623';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px+7,py-10);ctx.quadraticCurveTo(px+16,py-18,px+18,py-8);ctx.stroke();ctx.fillStyle='#f2a623';ctx.beginPath();ctx.arc(px+19,py-8,3,0,Math.PI*2);ctx.fill()}
  const modes=[s.s1mode,s.s2mode];supportSpots.forEach((p,i)=>{if(modes[i]==='none')return;let px=sx(p.x),py=sy(p.y);ctx.fillStyle=modes[i]==='mg'?'#111':'#222';ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.fillText(modes[i]==='mg'?'MG':'SN',px-7,py-11)});
  for(const q of z){if(q.dead)continue;let px=sx(q.x),py=sy(q.y);ctx.fillStyle='#4b5447';ctx.beginPath();ctx.arc(px,py,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#858977';ctx.beginPath();ctx.arc(px,py-12,8,0,Math.PI*2);ctx.fill()}
  for(const b of bul){ctx.fillStyle='#f3dfa1';ctx.beginPath();ctx.arc(sx(b.x),sy(b.y),3,0,Math.PI*2);ctx.fill()}
  for(const b of blood){ctx.fillStyle='rgba(110,20,18,'+Math.max(0,b.life/.65)+')';ctx.beginPath();ctx.arc(sx(b.x),sy(b.y),b.big?13:8,0,Math.PI*2);ctx.fill()}
  for(const t of tr){ctx.strokeStyle='rgba(255,240,180,'+Math.min(1,t.life/.15)+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx(t.x1),sy(t.y1));ctx.lineTo(sx(t.x2),sy(t.y2));ctx.stroke()}
  for(const r of rings){ctx.strokeStyle='rgba(242,166,35,'+Math.max(0,r.life/.55)+')';ctx.lineWidth=8;ctx.beginPath();ctx.arc(sx(r.x),sy(r.y),r.r,0,Math.PI*2);ctx.stroke()}
  let px=sx(s.x),py=sy(s.y);ctx.fillStyle='#284d2e';ctx.beginPath();ctx.arc(px,py,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+Math.cos(s.a)*28,py+Math.sin(s.a)*28);ctx.stroke();
  if(s.over){ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 38px sans-serif';ctx.fillText('YOU DIED',W/2,H/2);ctx.font='17px sans-serif';ctx.fillText(s.kills+' kills • '+s.support+' support kills',W/2,H/2+32);ctx.textAlign='start'}
}
function loop(now){let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();raf=requestAnimationFrame(loop)}
const stick=$('stick'),knob=$('knob');
function moveStick(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,lim=r.width*.32,d=Math.hypot(dx,dy);if(d>lim){dx=dx/d*lim;dy=dy/d*lim}joyX=dx/lim;joyY=dy/lim;knob.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))'}
stick.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;stick.setPointerCapture?.(pid);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===pid)moveStick(e)});
function endStick(e){if(pid===null||e.pointerId===pid){pid=null;joyX=joyY=0;knob.style.transform='translate(-50%,-50%)'}}

stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);

const aimStick=$('aimStick'),aimKnob=$('aimKnob');
function moveAim(e){
  let r=aimStick.getBoundingClientRect(),
      dx=e.clientX-r.left-r.width/2,
      dy=e.clientY-r.top-r.height/2,
      lim=r.width*.32,
      d=Math.hypot(dx,dy);
  if(d>lim){dx=dx/d*lim;dy=dy/d*lim}
  aimX=dx/lim; aimY=dy/lim;
  if(Math.hypot(aimX,aimY)>.08)s.a=Math.atan2(aimY,aimX);
  aimKnob.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';
}
aimStick.addEventListener('pointerdown',e=>{
  e.preventDefault();
  aimPid=e.pointerId;
  aimStick.setPointerCapture?.(aimPid);
  moveAim(e);
});
aimStick.addEventListener('pointermove',e=>{
  if(e.pointerId===aimPid)moveAim(e);
});
function endAim(e){
  if(aimPid===null||e.pointerId===aimPid){
    aimPid=null;
    aimX=Math.cos(s.a); aimY=Math.sin(s.a);
    aimKnob.style.transform='translate(-50%,-50%)';
  }
}
aimStick.addEventListener('pointerup',endAim);
aimStick.addEventListener('pointercancel',endAim);
$('switchGun').addEventListener('click',switchGun);
$('bomb').addEventListener('click',useBomb);
$('restart').addEventListener('click',reset);
reset();raf=requestAnimationFrame(loop);
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
