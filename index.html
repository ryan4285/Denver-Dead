<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Denver Dead — v12</title>
<style>
html,body{margin:0;background:#0f1113;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}*{box-sizing:border-box}button{font-family:inherit}
#game{max-width:760px;margin:auto;padding:10px;position:relative}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:12px;text-align:center}.hud>div{background:#1a1d20;border:1px solid #30353a;border-radius:9px;padding:6px}.muted{color:#9ba3aa;font-size:10px}.healthRow{display:flex;justify-content:space-between;font-size:12px;margin:7px 0 3px}#healthbar{height:14px;background:#3a1d1d;border:1px solid #454b51;border-radius:999px;overflow:hidden}#healthfill{height:100%;background:#44c767;width:100%}#gameCanvas{width:100%;display:block;background:#000;border:1px solid #333;border-radius:12px;touch-action:none}
.controls{display:flex;justify-content:center;align-items:flex-end;gap:38px;margin-top:44px;padding:10px 8px 4px}.stickWrap,.rightControls,.aimWrap{display:flex;flex-direction:column;align-items:center}.moveCluster{display:flex;align-items:flex-end;gap:8px}#stick,#aimStick{position:relative;width:122px;height:122px;border-radius:50%;border:2px solid #555;background:#17191c;touch-action:none}#knob,#aimKnob{position:absolute;width:50px;height:50px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#ddd}.actionCluster{display:flex;align-items:center;gap:7px;margin-bottom:20px}.rightControls{gap:7px}.round{border:0;border-radius:50%;font-weight:800;color:#fff;touch-action:none}#bomb{width:60px;height:60px;background:#79571b;font-size:11px;opacity:.45}#bomb.ready{background:#d68b18;opacity:1}#switchGun{width:60px;height:60px;background:#2d5068;font-size:10px;opacity:.45}#switchGun.ready{opacity:1}.pauseBtn{padding:8px 11px;border-radius:8px;border:1px solid #444;background:#202428;color:#eee;font-weight:700}.landscapePause{display:none}#notice{text-align:center;min-height:20px;font-weight:800;font-size:13px;color:#f2d07a}.statusLine{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:5px 0;font-size:11px}.statusChip{background:#1a1d20;border:1px solid #30353a;border-radius:8px;padding:4px 7px}.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(7,8,10,.93);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}.panel{width:min(620px,96vw);max-height:92vh;overflow:auto;background:#171a1e;border:1px solid #343a40;border-radius:16px;padding:20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}.panel h1{font-size:34px;letter-spacing:2px;margin:0 0 6px}.panel h2{margin:0 0 14px}.panel p{color:#adb5bd}.btn{border:1px solid #4b5259;background:#252a30;color:#fff;border-radius:10px;padding:11px 16px;font-weight:800;margin:5px}.btn.primary{background:#304d3a}.choiceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{min-height:100px}.smallText{font-size:12px;color:#aab1b7}.scoreGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:left;margin:12px 0}.scoreGrid div{background:#111417;padding:8px;border-radius:8px}.settingsRow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.radioLine{font-size:12px;color:#f2d07a;min-height:18px;margin-top:3px}.progressWrap{display:flex;justify-content:space-between;align-items:center;gap:8px}.timerBar{height:6px;background:#222;border-radius:99px;overflow:hidden;flex:1}.timerFill{height:100%;background:#d8b24c;width:0%}
@media(max-width:480px){#game{padding:7px}.hud{font-size:11px}.controls{gap:26px;margin-top:52px;padding:6px 4px 2px}#stick,#aimStick{width:112px;height:112px}#bomb,#switchGun{width:56px;height:56px}.actionCluster{margin-bottom:22px}.choiceGrid{grid-template-columns:1fr}}
@media(orientation:landscape){body{margin:0;overflow:hidden}#game{width:100vw;max-width:none;padding:4px 8px 2px}.hud{grid-template-columns:repeat(5,minmax(72px,1fr));gap:6px;font-size:10px;margin-bottom:4px}.healthRow{margin:2px 0 3px}canvas{display:block;width:auto!important;height:calc(100vh - 145px)!important;max-width:72vw;margin:0 auto;touch-action:none}.controls{position:absolute;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));margin:0;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;gap:0}.stickWrap,.rightControls,.aimWrap,.actionCluster,.pauseBtn{pointer-events:auto}.moveCluster{align-items:flex-end;gap:8px}.landscapePause{display:inline-block;margin-bottom:26px}#stick,#aimStick{width:112px;height:112px;background:rgba(23,25,28,.72)}#knob,#aimKnob{width:44px;height:44px}.rightControls{flex-direction:column;align-items:center;gap:7px;margin:0}.actionCluster{order:0;margin:0 0 6px;justify-content:center;gap:7px}.aimWrap{order:1;margin:0}#switchGun,#bomb{width:52px;height:52px}.portraitPause{display:none}#notice{position:absolute;left:50%;top:105px;transform:translateX(-50%);z-index:5;pointer-events:none;width:60vw}.statusLine{font-size:9px}}
</style>

<body>
<div id="game">
  <div class="hud">
    <div><span class="muted">WAVE</span><br><b id="wave">1</b></div>
    <div><span class="muted">KILLS</span><br><b id="kills">0</b></div>
    <div><span class="muted">SCORE</span><br><b id="score">0</b></div>
    <div><span class="muted">WEAPON</span><br><b id="weapon">Pistol</b></div>
    <div><span class="muted">BOMB</span><br><b id="bombHud">EMPTY</b></div>
  </div>
  <div class="healthRow"><b>HEALTH</b><span id="healthText">100 / 100</span></div>
  <div id="healthbar"><div id="healthfill"></div></div>
  <div class="statusLine"><span id="progress">20 pistol kills → Shotgun</span><span class="statusChip" id="combo">1× COMBO</span><span class="statusChip" id="difficultyHud">NORMAL</span></div>
  <div class="progressWrap hidden" id="doubleWrap"><span class="muted">2× DAMAGE</span><div class="timerBar"><div class="timerFill" id="doubleFill"></div></div></div>
  <div id="notice"></div><div class="radioLine" id="radio"></div>
  <canvas id="gameCanvas" width="720" height="500"></canvas>
  <button class="pauseBtn portraitPause" id="pausePortrait" type="button">Pause</button>
  <div class="controls">
    <div class="moveCluster">
      <div class="stickWrap"><div class="muted" style="margin-bottom:4px">MOVE</div><div id="stick"><div id="knob"></div></div></div>
      <button class="pauseBtn landscapePause" id="pauseLandscape" type="button">Pause</button>
    </div>
    <div class="rightControls">
      <div class="actionCluster"><button id="switchGun" class="round" type="button">SWITCH<br>GUN</button><button id="bomb" class="round" type="button">BOMB</button></div>
      <div class="aimWrap"><div class="muted" style="margin-bottom:4px">AIM</div><div id="aimStick"><div id="aimKnob"></div></div></div>
    </div>
  </div>
</div>

<div class="overlay" id="startScreen"><div class="panel"><h1>DENVER DEAD</h1><p>TAP TO SURVIVE</p><div><button class="btn primary" id="playBtn">PLAY</button></div><h3>DIFFICULTY</h3><div class="settingsRow"><button class="btn diff" data-diff="easy">Easy / Casual</button><button class="btn diff" data-diff="normal">Normal / Survival</button><button class="btn diff" data-diff="hard">Hard / Nightmare</button></div><div class="settingsRow" style="margin-top:10px"><button class="btn" id="highBtn">HIGH SCORES</button><button class="btn" id="soundBtn">SOUND: ON</button><button class="btn" id="musicBtn">MUSIC: ON</button></div><div id="highPanel" class="hidden"><h3>HIGH SCORES</h3><div class="scoreGrid" id="highGrid"></div></div></div></div>
<div class="overlay hidden" id="pauseScreen"><div class="panel"><h2>PAUSED</h2><button class="btn primary" id="resumeBtn">RESUME</button><button class="btn" id="restartBtn">RESTART</button><button class="btn" id="quitBtn">QUIT</button></div></div>
<div class="overlay hidden" id="upgradeScreen"><div class="panel"><h2 id="upgradeTitle">UPGRADE</h2><p>Pick ONE</p><div class="choiceGrid" id="upgradeChoices"></div></div></div>
<div class="overlay hidden" id="deathScreen"><div class="panel"><h1 style="color:#d25b5b">YOU DIED</h1><div class="scoreGrid" id="deathStats"></div><button class="btn primary" id="againBtn">PLAY AGAIN</button><button class="btn" id="deathQuitBtn">QUIT</button></div></div>
<script>
(()=>{
const c=document.getElementById('gameCanvas'),ctx=c.getContext('2d'),W=720,H=500,mapW=2200,mapH=1700,$=id=>document.getElementById(id);
const roads=[{x:0,y:210,w:2200,h:180},{x:0,y:620,w:2200,h:180},{x:0,y:1030,w:2200,h:180},{x:0,y:1420,w:2200,h:180},{x:220,y:0,w:180,h:1700},{x:730,y:0,w:180,h:1700},{x:1260,y:0,w:180,h:1700},{x:1770,y:0,w:180,h:1700}];
const blocks=[
{x:35,y:35,w:150,h:140,label:'LoDo'},{x:440,y:35,w:250,h:145,label:'Union Station'},{x:950,y:35,w:260,h:150,label:'Coors Field'},{x:1480,y:35,w:260,h:145,label:'Downtown Denver'},
{x:35,y:430,w:160,h:155,label:'16th Street'},{x:445,y:430,w:245,h:155,label:'Market'},{x:960,y:430,w:245,h:150,label:'CBD'},{x:1485,y:430,w:250,h:150,label:'Civic Center'},
{x:35,y:850,w:150,h:145,label:'Parking'},{x:450,y:850,w:240,h:150,label:'Construction'},{x:960,y:850,w:250,h:145,label:'Capitol'},{x:1490,y:850,w:245,h:145,label:'Broadway'},
{x:35,y:1240,w:150,h:135,label:'Alley'},{x:450,y:1240,w:240,h:135,label:'Speer'},{x:960,y:1240,w:250,h:135,label:'Downtown'},{x:1490,y:1240,w:245,h:135,label:'Civic Plaza'}];
const cars=[{x:560,y:285,w:72,h:34,speed:235,dur:130},{x:1060,y:695,w:78,h:36,speed:205,dur:170},{x:330,y:1110,w:74,h:34,speed:245,dur:110},{x:820,y:310,w:70,h:32,speed:250,dur:100},{x:1350,y:745,w:82,h:36,speed:190,dur:190},{x:780,y:1500,w:70,h:33,speed:240,dur:120}].map((q,i)=>({...q,id:i,hp:q.dur,usable:true,occupied:false}));
let barrels=[];const supportSpots=[{x:520,y:520},{x:1510,y:920}];
const weapons={pistol:{name:'Pistol',damage:1,cd:260,pellets:1,spread:0},shotgun:{name:'Shotgun',damage:2,cd:520,pellets:6,spread:.30},rifle:{name:'Assault Rifle',damage:3,cd:105,pellets:1,spread:.04},grenade:{name:'Grenade Launcher',damage:10,cd:700,pellets:1,spread:0}};
const diffs={easy:{name:'EASY',speed:.82,hp:.8,count:.8,healthFreq:.78,special:.55,score:.8},normal:{name:'NORMAL',speed:1,hp:1,count:1,healthFreq:1,special:1,score:1},hard:{name:'HARD',speed:1.22,hp:1.25,count:1.25,healthFreq:1.35,special:1.5,score:1.5}};
const radioMsgs=['Emergency broadcast: Downtown evacuation has failed.','Survivors reported near Union Station.','National Guard position at Civic Center has gone silent.','Multiple infected moving south through LoDo.','Rooftop survivor requesting assistance.'];
const upgradeDefs=[['+25 MAX HEALTH','health'],['+15% MOVEMENT SPEED','speed'],['+10% WEAPON DAMAGE','damage'],['FASTER ROOFTOP SUPPORT','support'],['LARGER BOMB RADIUS','bomb'],['LONGER DOUBLE-DAMAGE','double'],['FASTER WEAPON FIRE RATE','fire'],['MORE HEALTH FROM MEDKITS','medkit'],['LONGER AI COMPANION','companion']];
let s,z=[],bul=[],drops=[],bombDrops=[],specialDrops=[],doubleDrops=[],blood=[],tr=[],rings=[],survivors=[],companions=[],joyX=0,joyY=0,pid=null,aimX=1,aimY=0,aimPid=null,last=performance.now(),lastShot=0,raf,noticeUntil=0,paused=true,started=false,selectedDiff='normal',soundOn=true,musicOn=true,audioCtx=null,musicOsc=null,musicGain=null;
function loadScores(){try{return JSON.parse(localStorage.getItem('denverDeadScoresV12'))||{wave:0,score:0,kills:0,time:0,combo:0,pb:0}}catch{return{wave:0,score:0,kills:0,time:0,combo:0,pb:0}}}let highs=loadScores();
function saveScores(){localStorage.setItem('denverDeadScoresV12',JSON.stringify(highs))}
function beep(freq=300,dur=.06,type='square',gain=.03){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch{}}
function startMusic(){if(!musicOn||musicOsc)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();musicOsc=audioCtx.createOscillator();musicGain=audioCtx.createGain();musicOsc.type='sawtooth';musicOsc.frequency.value=42;musicGain.gain.value=.007;musicOsc.connect(musicGain);musicGain.connect(audioCtx.destination);musicOsc.start()}catch{}}
function stopMusic(){try{musicOsc?.stop()}catch{}musicOsc=null;musicGain=null}
function blocked(px,py,r,ignoreCar=false){return blocks.some(b=>px+r>b.x&&px-r<b.x+b.w&&py+r>b.y&&py-r<b.y+b.h)||(!ignoreCar&&cars.some(q=>q.usable&&!q.occupied&&Math.hypot(px-q.x,py-q.y)<r+30))}
function spot(minDist=0){let p,n=0;do{p={x:35+Math.random()*(mapW-70),y:35+Math.random()*(mapH-70)};n++}while((blocked(p.x,p.y,18)||Math.hypot(p.x-s.x,p.y-s.y)<minDist)&&n<800);return p}
function spawnBarrels(){barrels=[];let n=7+Math.floor(s.wave/5);for(let i=0;i<n;i++){let p=spot(90);barrels.push({...p,hp:2,dead:false})}}
function zType(){if(s.wave<8)return 'normal';let chance=Math.min(.45,.06+(s.wave-8)*.012)*diffs[selectedDiff].special;if(Math.random()>chance)return 'normal';let a=['runner'];if(s.wave>=10)a.push('tank');if(s.wave>=12)a.push('armored');if(s.wave>=15)a.push('screamer');if(s.wave>=18)a.push('exploder');return a[Math.floor(Math.random()*a.length)]}
function zombieStats(type){let base={hp:3+Math.floor((s.wave-1)/6),speed:48+Math.random()*20+s.wave*1.3,damage:5};if(type==='runner'){base.speed*=1.65;base.hp*=.65}if(type==='tank'){base.speed*=.65;base.hp*=3;base.damage=10}if(type==='armored'){base.speed*=.8;base.hp*=2.2}if(type==='screamer'){base.speed*=.9;base.hp*=1.1}if(type==='exploder'){base.speed*=1.05;base.hp*=.9;base.damage=15}base.hp=Math.max(1,Math.round(base.hp*diffs[selectedDiff].hp));base.speed*=diffs[selectedDiff].speed;return base}
function spawnWave(){let n=Math.round((5+(s.wave-1)*5)*diffs[selectedDiff].count);for(let i=0;i<n;i++){let p=spot(280),type=zType(),st=zombieStats(type);z.push({x:p.x,y:p.y,hp:st.hp,max:st.hp,speed:st.speed,damage:st.damage,attack:0,dead:false,type,scream:3+Math.random()*3})}spawnBarrels();if(s.wave>=6&&Math.random()<.45)spawnSurvivor();if(s.wave>10&&(s.wave%5===0||Math.random()<.22))specialDrops.push({...spot(160),kind:'grenade'});if(s.wave>=8&&Math.random()<.3)doubleDrops.push({...spot(130),kind:'double'})}
function say(t,secs=2.4){$('notice').textContent=t;noticeUntil=s.time+secs}
function radio(t){$('radio').textContent=t;setTimeout(()=>{if($('radio').textContent===t)$('radio').textContent=''},5000)}
function reset(){let d=diffs[selectedDiff];s={x:850,y:730,a:-1.57,hp:100,maxHp:100,wave:1,kills:0,score:0,support:0,gun:'pistol',pk:0,sk:0,time:0,nextHealth:30*d.healthFreq,nextBomb:50,bomb:false,grenadeShots:0,doubleUntil:0,over:false,between:0,nextWave:false,combo:1,maxCombo:1,lastKill:-99,multKills:0,inCar:null,carHp:0,moveMult:1,damageMult:1,fireMult:1,supportMult:1,bombMult:1,doubleDuration:18,medkit:25,companionDuration:25,s1mode:'none',s2mode:'none',nextS1:null,nextS2:null};z=[];bul=[];drops=[];bombDrops=[];specialDrops=[];doubleDrops=[];blood=[];tr=[];rings=[];survivors=[];companions=[];joyX=joyY=0;aimX=1;aimY=0;paused=false;spawnWave();hud();say('SURVIVE DENVER',1.6);radio('Emergency broadcast: Downtown evacuation has failed.');startMusic()}
function supportMode(slot){if(slot===1){if(s.wave>=10)return'mg';if(s.wave>=5)return'sniper'}else{if(s.wave>=20)return'mg';if(s.wave>=15)return'sniper'}return'none'}
function syncSupport(){for(let slot=1;slot<=2;slot++){let key='s'+slot+'mode',nk='nextS'+slot,m=supportMode(slot);if(m!==s[key]){s[key]=m;s[nk]=m==='sniper'?s.time+10/ s.supportMult:m==='mg'?s.time+3/s.supportMult:null;if(m==='sniper')say(slot===1?'ROOFTOP SNIPER HAS ARRIVED':'SECOND ROOFTOP SNIPER HAS ARRIVED');if(m==='mg')say('ROOFTOP SUPPORT UPGRADED: MACHINE GUNNER')}}}
function hud(){$('wave').textContent=s.wave;$('kills').textContent=s.kills;$('score').textContent=Math.round(s.score);$('weapon').textContent=s.grenadeShots>0?'Grenade Launcher':weapons[s.gun].name;$('healthText').textContent=Math.max(0,Math.ceil(s.hp))+' / '+s.maxHp;$('healthfill').style.width=Math.max(0,s.hp/s.maxHp*100)+'%';$('bombHud').textContent=s.bomb?'READY':'EMPTY';$('bomb').classList.toggle('ready',s.bomb);let gunUnlocked=s.pk>=20||s.sk>=20||s.gun!=='pistol';$('switchGun').disabled=!gunUnlocked;$('switchGun').classList.toggle('ready',gunUnlocked);$('progress').textContent=s.grenadeShots>0?'GRENADE LAUNCHER — 1 SHOT':s.gun==='pistol'?Math.max(0,20-s.pk)+' pistol kills → Shotgun':s.gun==='shotgun'?Math.max(0,20-s.sk)+' shotgun kills → Assault Rifle':'MAX WEAPON — Assault Rifle';$('combo').textContent=s.combo+'× COMBO';$('difficultyHud').textContent=diffs[selectedDiff].name;let left=Math.max(0,s.doubleUntil-s.time);$('doubleWrap').classList.toggle('hidden',left<=0);$('doubleFill').style.width=Math.min(100,left/s.doubleDuration*100)+'%'}
function addKill(g,base=100){s.kills++;s.multKills++;let gap=s.time-s.lastKill;if(gap<2.4)s.combo=Math.min(8,s.combo+1);else s.combo=1;s.lastKill=s.time;s.maxCombo=Math.max(s.maxCombo,s.combo);s.score+=base*s.combo*diffs[selectedDiff].score;if(g==='pistol')s.pk++;if(g==='shotgun')s.sk++;if(s.gun==='pistol'&&s.pk>=20){s.gun='shotgun';say('SHOTGUN UNLOCKED!');beep(700,.15,'square',.05)}else if(s.gun==='shotgun'&&s.sk>=20){s.gun='rifle';say('ASSAULT RIFLE UNLOCKED!');beep(900,.15,'square',.05)}}
function shoot(){if(s.over||paused||s.between>0)return;let now=performance.now(),g=s.grenadeShots>0?'grenade':s.gun,w=weapons[g],cd=w.cd*s.fireMult;if(now-lastShot<cd)return;lastShot=now;beep(g==='pistol'?380:g==='shotgun'?180:g==='rifle'?520:110,.045,g==='grenade'?'sine':'square',g==='grenade'?.07:.02);for(let i=0;i<w.pellets;i++){let a=s.a+(w.pellets===1?0:(Math.random()-.5)*w.spread),damage=w.damage*s.damageMult*(s.time<s.doubleUntil?2:1);bul.push({x:s.x,y:s.y,vx:Math.cos(a)*700,vy:Math.sin(a)*700,life:1.1,damage,gun:g})}if(g==='grenade'){s.grenadeShots=0;s.gun=s.gun==='grenade'?'rifle':s.gun}}
function sniperShot(slot){let live=z.filter(q=>!q.dead);if(!live.length)return;let q=live[Math.floor(Math.random()*live.length)],p=supportSpots[slot-1];q.dead=true;s.support++;s.score+=75*diffs[selectedDiff].score;tr.push({x1:p.x,y1:p.y,x2:q.x,y2:q.y,life:.18});beep(720,.05,'square',.015)}
function mgBurst(slot){let p=supportSpots[slot-1];for(let shot=0;shot<5;shot++){let live=z.filter(q=>!q.dead);if(!live.length)break;let q=live[Math.floor(Math.random()*live.length)];q.hp-=1*s.damageMult;tr.push({x1:p.x,y1:p.y,x2:q.x+(Math.random()-.5)*12,y2:q.y+(Math.random()-.5)*12,life:.12+shot*.025});if(q.hp<=0){q.dead=true;s.support++;s.score+=55*diffs[selectedDiff].score}}beep(540,.035,'square',.01)}
function switchGun(){if(s.grenadeShots>0)return;let u=['pistol'];if(s.pk>=20||s.gun==='shotgun'||s.gun==='rifle'||s.sk>=20)u.push('shotgun');if(s.sk>=20||s.gun==='rifle')u.push('rifle');if(u.length<2)return;let i=u.indexOf(s.gun);s.gun=u[(i+1)%u.length];say(weapons[s.gun].name.toUpperCase(),1);hud()}
