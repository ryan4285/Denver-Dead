<script>
(()=>{
const c=document.getElementById('gameCanvas'),ctx=c.getContext('2d'),W=720,H=500,mapW=2200,mapH=1700,$=id=>document.getElementById(id);
const roads=[{x:0,y:210,w:2200,h:180},{x:0,y:620,w:2200,h:180},{x:0,y:1030,w:2200,h:180},{x:0,y:1420,w:2200,h:180},{x:220,y:0,w:180,h:1700},{x:730,y:0,w:180,h:1700},{x:1260,y:0,w:180,h:1700},{x:1770,y:0,w:180,h:1700}];
const blocks=[
{x:35,y:35,w:150,h:140,label:'LoDo'},{x:440,y:35,w:250,h:145,label:'Union Station'},{x:950,y:35,w:260,h:150,label:'Coors Field'},{x:1480,y:35,w:260,h:145,label:'Downtown Denver'},
{x:35,y:430,w:160,h:155,label:'16th Street'},{x:445,y:430,w:245,h:155,label:'Market'},{x:960,y:430,w:245,h:150,label:'CBD'},{x:1485,y:430,w:250,h:150,label:'Civic Center'},
{x:35,y:850,w:150,h:145,label:'Parking'},{x:450,y:850,w:240,h:150,label:'Construction'},{x:960,y:850,w:250,h:145,label:'Capitol'},{x:1490,y:850,w:245,h:145,label:'Broadway'},
{x:35,y:1240,w:150,h:135,label:'Alley'},{x:450,y:1240,w:240,h:135,label:'Speer'},{x:960,y:1240,w:250,h:135,label:'Downtown'},{x:1490,y:1240,w:245,h:135,label:'Civic Plaza'}];
const baseCars=[{x:560,y:285,w:72,h:34,speed:235,dur:130},{x:1060,y:695,w:78,h:36,speed:205,dur:170},{x:330,y:1110,w:74,h:34,speed:245,dur:110},{x:820,y:310,w:70,h:32,speed:250,dur:100},{x:1350,y:745,w:82,h:36,speed:190,dur:190},{x:780,y:1500,w:70,h:33,speed:240,dur:120}];
const cars=baseCars.map((q,i)=>({...q,id:i,hp:q.dur,usable:true,occupied:false}));
let barrels=[];const supportSpots=[{x:520,y:520},{x:1510,y:920}];
const weapons={pistol:{name:'Pistol',damage:1,cd:260,pellets:1,spread:0},shotgun:{name:'Shotgun',damage:2,cd:520,pellets:6,spread:.30},rifle:{name:'Assault Rifle',damage:3,cd:105,pellets:1,spread:.04},grenade:{name:'Grenade Launcher',damage:10,cd:700,pellets:1,spread:0}};
const diffs={easy:{name:'EASY',speed:.82,hp:.8,count:.8,healthFreq:.78,special:.55,score:.8,zDamage:.70,attackCd:.88,contact:31},normal:{name:'NORMAL',speed:1,hp:1,count:1,healthFreq:1,special:1,score:1,zDamage:1.35,attackCd:.58,contact:34},hard:{name:'HARD',speed:1.22,hp:1.25,count:1.25,healthFreq:1.35,special:1.5,score:1.5,zDamage:1.8,attackCd:.45,contact:36}};
const radioMsgs=['Emergency broadcast: Downtown evacuation has failed.','Survivors reported near Union Station.','National Guard position at Civic Center has gone silent.','Multiple infected moving south through LoDo.','Rooftop survivor requesting assistance.'];
const upgradeDefs=[['+25 MAX HEALTH','health'],['+15% MOVEMENT SPEED','speed'],['+10% WEAPON DAMAGE','damage'],['FASTER ROOFTOP SUPPORT','support'],['LARGER BOMB RADIUS','bomb'],['LONGER DOUBLE-DAMAGE','double'],['FASTER WEAPON FIRE RATE','fire'],['MORE HEALTH FROM MEDKITS','medkit'],['LONGER AI COMPANION','companion']];
let s,z=[],bul=[],drops=[],bombDrops=[],specialDrops=[],doubleDrops=[],blood=[],tr=[],rings=[],survivors=[],companions=[],joyX=0,joyY=0,pid=null,aimX=1,aimY=0,aimPid=null,last=performance.now(),lastShot=0,raf,noticeUntil=0,paused=true,started=false,selectedDiff='normal',soundOn=false,musicOn=false,audioCtx=null,musicOsc=null,musicGain=null;
function loadScores(){try{let current=JSON.parse(localStorage.getItem('denverDeadScoresV26'));if(current)return current;let old=JSON.parse(localStorage.getItem('denverDeadScoresV24'))||JSON.parse(localStorage.getItem('denverDeadScoresV19'))||JSON.parse(localStorage.getItem('denverDeadScoresV18'))||JSON.parse(localStorage.getItem('denverDeadScoresV15'))||JSON.parse(localStorage.getItem('denverDeadScoresV14'));if(old)return{wave:old.wave||0,score:0,kills:old.kills||0,time:old.time||0,combo:old.combo||0,pb:0};return{wave:0,score:0,kills:0,time:0,combo:0,pb:0}}catch{return{wave:0,score:0,kills:0,time:0,combo:0,pb:0}}}let highs=loadScores();
function saveScores(){try{localStorage.setItem('denverDeadScoresV26',JSON.stringify(highs))}catch{}}
function updateHighsFromState(st){if(!st)return;highs.wave=Math.max(highs.wave||0,st.wave||0);highs.score=Math.max(highs.score||0,Math.round(st.score||0));highs.kills=Math.max(highs.kills||0,st.kills||0);highs.time=Math.max(highs.time||0,Math.round(st.time||0));highs.combo=Math.max(highs.combo||0,st.maxCombo||0);highs.pb=Math.max(highs.pb||0,Math.round(st.score||0));saveScores()}
function updateHighsFromRun(){if(!s)return;updateHighsFromState(s)}
const RUN_KEY='denverDeadRun';let lastAutosave=0;
function getSavedRun(){try{let r=JSON.parse(localStorage.getItem(RUN_KEY));return r&&r.state&&!r.state.over?r:null}catch{return null}}
function updateContinueButton(){let has=!!getSavedRun();$('continueBtn').classList.toggle('hidden',!has)}
function saveRun(force=false){if(!started||!s||s.over)return;let now=performance.now();if(!force&&now-lastAutosave<1800)return;lastAutosave=now;updateHighsFromRun();try{localStorage.setItem(RUN_KEY,JSON.stringify({version:31,savedAt:Date.now(),difficulty:selectedDiff,state:s,zombies:z,drops,bombDrops,specialDrops,doubleDrops,survivors,companions,barrels,cars:cars.map(q=>({...q}))}))}catch{}}
function clearRun(){try{localStorage.removeItem(RUN_KEY)}catch{}updateContinueButton()}
function restoreRun(){let r=getSavedRun();if(!r)return false;selectedDiff=r.difficulty||'normal';s=r.state;if((r.version||0)<26)s.score=0;updateHighsFromState(s);z=Array.isArray(r.zombies)?r.zombies:[];enforceSingleScreamer();drops=Array.isArray(r.drops)?r.drops:[];bombDrops=Array.isArray(r.bombDrops)?r.bombDrops:[];specialDrops=Array.isArray(r.specialDrops)?r.specialDrops:[];doubleDrops=Array.isArray(r.doubleDrops)?r.doubleDrops:[];survivors=Array.isArray(r.survivors)?r.survivors:[];companions=Array.isArray(r.companions)?r.companions:[];barrels=Array.isArray(r.barrels)?r.barrels:[];cars.splice(0,cars.length,...baseCars.map((q,i)=>({...q,id:i,hp:q.dur,usable:true,occupied:false})));if(Array.isArray(r.cars))r.cars.forEach((q,i)=>{if(cars[i])Object.assign(cars[i],q)});if(s.inCar!==null){let q=cars[s.inCar];if(!q||!q.usable){s.inCar=null;s.carHp=0}else{q.occupied=true;q.hp=Math.max(0,Math.min(q.dur,s.carHp));s.carHp=q.hp;q.x=s.x;q.y=s.y}}bul=[];blood=[];tr=[];rings=[];joyX=joyY=0;aimX=Math.cos(s.a||0);aimY=Math.sin(s.a||0);started=true;paused=false;last=performance.now();lastShot=0;$('startScreen').classList.add('hidden');$('pauseScreen').classList.add('hidden');$('deathScreen').classList.add('hidden');[...document.querySelectorAll('.diff')].forEach(x=>x.style.outline=x.dataset.diff===selectedDiff?'2px solid #d4b45d':'');hud();say('RUN RESTORED',1.5);startMusic();return true}
function beep(freq=300,dur=.06,type='square',gain=.03){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch{}}
function startMusic(){if(!musicOn||musicOsc)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();musicOsc=audioCtx.createOscillator();musicGain=audioCtx.createGain();musicOsc.type='sawtooth';musicOsc.frequency.value=42;musicGain.gain.value=.007;musicOsc.connect(musicGain);musicGain.connect(audioCtx.destination);musicOsc.start()}catch{}}
function stopMusic(){try{musicOsc?.stop()}catch{}musicOsc=null;musicGain=null}
function blocked(px,py,r,ignoreCar=false){return blocks.some(b=>px+r>b.x&&px-r<b.x+b.w&&py+r>b.y&&py-r<b.y+b.h)||(!ignoreCar&&cars.some(q=>q.usable&&!q.occupied&&px+r>q.x-q.w/2&&px-r<q.x+q.w/2&&py+r>q.y-q.h/2&&py-r<q.y+q.h/2))}
function nearCarEdge(px,py,q,pad=20){let dx=Math.max(Math.abs(px-q.x)-q.w/2,0),dy=Math.max(Math.abs(py-q.y)-q.h/2,0);return Math.hypot(dx,dy)<=pad}
function moveZombieAroundObstacles(q,target,sp){let dx=target.x-q.x,dy=target.y-q.y,dist=Math.hypot(dx,dy)||1,ux=dx/dist,uy=dy/dist;
  const tries=[[ux,uy],[ux,0],[0,uy],[-uy,ux],[uy,-ux],[-uy*.75+ux*.66,ux*.75+uy*.66],[uy*.75+ux*.66,-ux*.75+uy*.66]];
  for(const [tx,ty] of tries){let len=Math.hypot(tx,ty)||1,nx=q.x+tx/len*sp,ny=q.y+ty/len*sp;if(!blocked(nx,ny,16)){q.x=nx;q.y=ny;return true}}
  return false
}
function spot(minDist=0){let p,n=0;do{p={x:35+Math.random()*(mapW-70),y:35+Math.random()*(mapH-70)};n++}while((blocked(p.x,p.y,18)||Math.hypot(p.x-s.x,p.y-s.y)<minDist)&&n<800);return p}
function nearbyOpenSpot(cx,cy,minR=34,maxR=150,r=18){for(let i=0;i<80;i++){let a=Math.random()*Math.PI*2,d=minR+Math.random()*(maxR-minR),x=Math.max(22,Math.min(mapW-22,cx+Math.cos(a)*d)),y=Math.max(22,Math.min(mapH-22,cy+Math.sin(a)*d));if(!blocked(x,y,r))return{x,y}}return spot(0)}
function freeStuckZombie(q){if(!blocked(q.x,q.y,16))return false;let p=nearbyOpenSpot(q.x,q.y,36,180,16);q.x=p.x;q.y=p.y;return true}
function spawnBarrels(){barrels=[];let n=7+Math.floor(s.wave/5);for(let i=0;i<n;i++){let p=spot(90);barrels.push({...p,hp:2,dead:false})}}
function zType(){if(s.wave<8)return 'normal';let chance=Math.min(.45,.06+(s.wave-8)*.012)*diffs[selectedDiff].special;if(Math.random()>chance)return 'normal';let a=['runner'];if(s.wave>=10)a.push('tank');if(s.wave>=12)a.push('armored');if(s.wave>=15&&!z.some(q=>!q.dead&&q.type==='screamer'))a.push('screamer');if(s.wave>=18)a.push('exploder');return a[Math.floor(Math.random()*a.length)]}
