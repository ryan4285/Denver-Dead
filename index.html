<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<title>Denver Dead</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:auto}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}
.card{background:#202226;border:1px solid #34373d;border-radius:12px;padding:8px;text-align:center}.small{font-size:11px;color:#aaa}.big{font-weight:700}
canvas{display:block;width:100%;border:1px solid #383b40;border-radius:14px;background:#000;touch-action:none}
.controls{display:flex;justify-content:center;align-items:center;gap:28px;background:#202226;border-radius:14px;padding:14px;margin-top:9px}
.stick{width:138px;height:138px;border-radius:50%;border:2px solid #444;background:#17191c;position:relative;touch-action:none;flex:0 0 auto}
.knob{width:58px;height:58px;border-radius:50%;background:#d9d9d9;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.fire{width:112px;height:112px;border-radius:50%;border:0;font-weight:800;font-size:20px;background:#d5d5d5;color:#111;touch-action:none}
.top{display:flex;justify-content:space-between;align-items:center}.pauseBtn{padding:10px 13px;border-radius:10px;border:1px solid #555;background:#222;color:#eee;font-weight:700}.landscapePause{display:none}
.progress{background:#202226;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px}
@media(max-width:390px){.controls{gap:18px;padding:12px 8px}.stick{width:125px;height:125px}.fire{width:100px;height:100px}.hud{font-size:13px}}
@media(orientation:landscape){.top .pauseBtn{display:none}.controls{justify-content:space-between}.moveCluster{display:flex;align-items:center;gap:10px}.landscapePause{display:inline-block;align-self:center;min-width:74px}.moveWrap{display:flex;flex-direction:column}.controls{padding:10px 14px}.stick{width:118px;height:118px}.fire{width:96px;height:96px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><b>DENVER DEAD</b><div class="small">Aerial Zombie Survival</div></div><button class="pauseBtn" id="pauseTop">Pause</button></div>
<div class="hud">
<div class="card"><div class="small">Health</div><div class="big" id="health">100</div></div>
<div class="card"><div class="small">Weapon</div><div class="big" id="weapon">Pistol</div></div>
<div class="card"><div class="small">Wave</div><div class="big" id="wave">1</div></div>
<div class="card"><div class="small">Kills</div><div class="big" id="kills">0</div></div>
</div>
<div class="progress" id="progress">20 pistol kills → Shotgun</div>
<canvas id="game" width="720" height="500"></canvas>
<div class="controls">
<div class="moveCluster"><div class="moveWrap"><div class="small" style="margin-bottom:7px">MOVE</div><div class="stick" id="stick"><div class="knob" id="knob"></div></div></div><button class="pauseBtn landscapePause" id="pauseLandscape">Pause</button></div>
<button class="fire" id="fire">FIRE</button>
</div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height;
const healthEl=document.getElementById('health'),weaponEl=document.getElementById('weapon'),waveEl=document.getElementById('wave'),killsEl=document.getElementById('kills'),progressEl=document.getElementById('progress');
const stick=document.getElementById('stick'),knob=document.getElementById('knob'),fire=document.getElementById('fire');
let st,zombies=[],bullets=[],particles=[],last=performance.now(),lastShot=0,joyX=0,joyY=0,fireHeld=false,stickPointer=null,paused=false;
const mapW=1800,mapH=1400;
const roads=[{x:0,y:240,w:1800,h:150},{x:0,y:650,w:1800,h:160},{x:0,y:1060,w:1800,h:150},{x:260,y:0,w:150,h:1400},{x:760,y:0,w:160,h:1400},{x:1280,y:0,w:150,h:1400}];
const blocks=[];for(let col=0;col<4;col++)for(let row=0;row<3;row++){const x=[40,460,970,1480][col],y=[40,440,860][row];blocks.push({x,y,w:[180,240,220,240][col],h:[150,160,150][row],label:['LoDo','Market','CBD','Civic'][col]});}
const weapons={pistol:{name:'Pistol',damage:1,cooldown:260,speed:650,spread:0,pellets:1},shotgun:{name:'Shotgun',damage:2,cooldown:520,speed:600,spread:.24,pellets:6},rifle:{name:'Assault Rifle',damage:3,cooldown:100,speed:780,spread:.035,pellets:1}};
const wp=()=>weapons[st.weapon];
function reset(){st={x:850,y:730,angle:-Math.PI/2,health:100,wave:1,kills:0,weapon:'pistol',pistolKills:0,shotgunKills:0,gameOver:false};zombies=[];bullets=[];particles=[];joyX=joyY=0;paused=false;fireHeld=false;centerKnob();syncPauseButtons();spawnWave();hud()}
function spawnWave(){const n=6+st.wave*3;for(let i=0;i<n;i++){let x,y;do{x=80+Math.random()*(mapW-160);y=80+Math.random()*(mapH-160)}while(Math.hypot(x-st.x,y-st.y)<350);const hp=3+Math.floor(st.wave/4);zombies.push({x,y,hp,maxHp:hp,speed:55+Math.random()*25+st.wave*2,attack:0,dead:false,r:16})}}
function hud(){healthEl.textContent=Math.max(0,Math.ceil(st.health));weaponEl.textContent=wp().name;waveEl.textContent=st.wave;killsEl.textContent=st.kills;progressEl.textContent=st.weapon==='pistol'?`${Math.max(0,20-st.pistolKills)} pistol kills → Shotgun`:st.weapon==='shotgun'?`${Math.max(0,20-st.shotgunKills)} shotgun kills → Assault Rifle`:'MAX WEAPON — Assault Rifle'}
function upgrade(){if(st.weapon==='pistol'&&st.pistolKills>=20)st.weapon='shotgun';else if(st.weapon==='shotgun'&&st.shotgunKills>=20)st.weapon='rifle';hud()}
function shoot(){if(st.gameOver||paused)return;const now=performance.now(),w=wp();if(now-lastShot<w.cooldown)return;lastShot=now;for(let i=0;i<w.pellets;i++){const off=w.pellets===1?0:(Math.random()-.5)*w.spread,a=st.angle+off;bullets.push({x:st.x+Math.cos(a)*24,y:st.y+Math.sin(a)*24,vx:Math.cos(a)*w.speed,vy:Math.sin(a)*w.speed,life:1.15,damage:w.damage,weapon:st.weapon})}}
function rectHit(x,y,r){return blocks.some(b=>x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)}
function kill(type){st.kills++;if(type==='pistol')st.pistolKills++;else if(type==='shotgun')st.shotgunKills++;upgrade()}
function step(dt){if(paused)return;if(!st.gameOver){const m=Math.hypot(joyX,joyY);if(m>.08){const dx=joyX/m,dy=joyY/m;st.angle=Math.atan2(dy,dx);const sp=150*Math.min(1,m);const nx=st.x+dx*sp*dt,ny=st.y+dy*sp*dt;if(!rectHit(nx,st.y,14))st.x=Math.max(20,Math.min(mapW-20,nx));if(!rectHit(st.x,ny,14))st.y=Math.max(20,Math.min(mapH-20,ny))}if(fireHeld)shoot();for(const z of zombies){if(z.dead)continue;const dx=st.x-z.x,dy=st.y-z.y,d=Math.hypot(dx,dy);if(d>25){z.x+=dx/d*z.speed*dt;z.y+=dy/d*z.speed*dt}else{z.attack-=dt;if(z.attack<=0){st.health-=8;z.attack=.7;if(st.health<=0){st.health=0;st.gameOver=true}}}}}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const z of zombies){if(z.dead)continue;if(Math.hypot(b.x-z.x,b.y-z.y)<z.r+4){z.hp-=b.damage;b.life=0;for(let i=0;i<7;i++)particles.push({x:z.x,y:z.y,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,life:.38});if(z.hp<=0){z.dead=true;kill(b.weapon)}break}}}bullets=bullets.filter(b=>b.life>0&&b.x>0&&b.x<mapW&&b.y>0&&b.y<mapH);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(!st.gameOver&&zombies.every(z=>z.dead)){st.wave++;spawnWave()}hud()}
function draw(){const camX=Math.max(W/2,Math.min(mapW-W/2,st.x)),camY=Math.max(H/2,Math.min(mapH-H/2,st.y)),sx=x=>x-camX+W/2,sy=y=>y-camY+H/2;ctx.fillStyle='#777b74';ctx.fillRect(0,0,W,H);ctx.fillStyle='#34373a';roads.forEach(r=>ctx.fillRect(sx(r.x),sy(r.y),r.w,r.h));ctx.strokeStyle='#d7c56f';ctx.lineWidth=3;ctx.setLineDash([18,16]);roads.forEach(r=>{ctx.beginPath();if(r.w>r.h){ctx.moveTo(sx(r.x),sy(r.y+r.h/2));ctx.lineTo(sx(r.x+r.w),sy(r.y+r.h/2))}else{ctx.moveTo(sx(r.x+r.w/2),sy(r.y));ctx.lineTo(sx(r.x+r.w/2),sy(r.y+r.h))}ctx.stroke()});ctx.setLineDash([]);for(const b of blocks){const x=sx(b.x),y=sy(b.y);ctx.fillStyle='#555c62';ctx.fillRect(x,y,b.w,b.h);ctx.fillStyle='#6e767d';ctx.fillRect(x+8,y+8,b.w-16,b.h-16);ctx.fillStyle='#ddd';ctx.font='11px sans-serif';ctx.fillText(b.label,x+10,y+16)}for(const z of zombies){if(z.dead)continue;const x=sx(z.x),y=sy(z.y);ctx.fillStyle='#485448';ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#858a74';ctx.beginPath();ctx.arc(x,y-12,8,0,Math.PI*2);ctx.fill();const pct=Math.max(0,z.hp/z.maxHp);ctx.fillStyle='#111';ctx.fillRect(x-15,y-27,30,4);ctx.fillStyle='#bbb';ctx.fillRect(x-15,y-27,30*pct,4)}for(const b of bullets){ctx.fillStyle='#f3dfa1';ctx.beginPath();ctx.arc(sx(b.x),sy(b.y),3,0,Math.PI*2);ctx.fill()}for(const p of particles){ctx.fillStyle=`rgba(110,20,18,${Math.max(0,p.life/.38)})`;ctx.beginPath();ctx.arc(sx(p.x),sy(p.y),3,0,Math.PI*2);ctx.fill()}const px=sx(st.x),py=sy(st.y);ctx.fillStyle='#2d4054';ctx.beginPath();ctx.arc(px,py,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#202020';ctx.lineWidth=st.weapon==='shotgun'?7:5;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+Math.cos(st.angle)*(st.weapon==='rifle'?32:27),py+Math.sin(st.angle)*(st.weapon==='rifle'?32:27));ctx.stroke();if(paused&&!st.gameOver){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 38px sans-serif';ctx.fillText('PAUSED',W/2,H/2)}if(st.gameOver){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 38px sans-serif';ctx.fillText('YOU DIED',W/2,H/2);ctx.font='18px sans-serif';ctx.fillText(`${st.kills} zombies killed`,W/2,H/2+32)}}
function loop(now){const dt=Math.min(.035,(now-last)/1000);last=now;step(dt);draw();requestAnimationFrame(loop)}
function centerKnob(){knob.style.transform='translate(-50%,-50%)'}
function updateStick(e){const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const radius=r.width*.32,d=Math.hypot(dx,dy);if(d>radius){dx=dx/d*radius;dy=dy/d*radius}joyX=dx/radius;joyY=dy/radius;knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture?.(e.pointerId);updateStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)updateStick(e)});const endStick=e=>{if(stickPointer===null||e.pointerId===stickPointer){stickPointer=null;joyX=joyY=0;centerKnob()}};stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
fire.addEventListener('pointerdown',e=>{e.preventDefault();if(!paused){fireHeld=true;shoot()}});['pointerup','pointercancel','pointerleave'].forEach(t=>fire.addEventListener(t,e=>{e.preventDefault();fireHeld=false}));
function syncPauseButtons(){const label=paused?'Resume':'Pause';document.getElementById('pauseTop').textContent=label;document.getElementById('pauseLandscape').textContent=label}
function togglePause(){if(st.gameOver)return;paused=!paused;fireHeld=false;joyX=joyY=0;stickPointer=null;centerKnob();last=performance.now();syncPauseButtons()}
document.getElementById('pauseTop').addEventListener('click',togglePause);document.getElementById('pauseLandscape').addEventListener('click',togglePause);
reset();requestAnimationFrame(loop);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
